name: sync-larch
on:
  schedule:
    - cron: '17 22 * * *'   # 台灣時間 06:17
  workflow_dispatch:
    inputs:
      force:
        description: 版本沒變也重抓並跑 smoke
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - id: sync
        run: python3 sync.py ${{ inputs.force && '--force' || '' }}
      - id: smoke
        if: steps.sync.outputs.changed == 'true'
        # 結束碼 2＝只有白板壞了：播放器正常，快取照樣更新，另外開 issue
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1920x1080x24" node smoke.mjs
          code=$?
          if [ $code -eq 2 ]; then echo "board=broken" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
        env:
          CHROME: /usr/bin/google-chrome
      - if: failure() || steps.smoke.outputs.board == 'broken'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-fail
          path: smoke-fail.png
          if-no-files-found: ignore
      - if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/larch
          git diff --cached --quiet || { git commit -m "chore: 同步 Larch 前端 $(cat vendor/larch/VERSION)" && git push; }
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create sync-failure --color B60205 2>/dev/null || true
          if [ -z "$(gh issue list --label sync-failure --state open --json number -q '.[].number')" ]; then
            gh issue create --label sync-failure --title "Larch 前端同步失敗" \
              --body "舊快取照用，本機預覽不受影響。紀錄：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
      - if: steps.smoke.outputs.board == 'broken'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create board-broken --color D93F0B 2>/dev/null || true
          if [ -z "$(gh issue list --label board-broken --state open --json number -q '.[].number')" ]; then
            gh issue create --label board-broken --title "Larch 白板在本機畫不出來" \
              --body "播放器正常，快取已照常更新；只有白板檢視（/preview/local?view=board）壞了，多半是 /api/preview 的資料格式變了，要補 serve.py 的替身。紀錄與截圖：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
