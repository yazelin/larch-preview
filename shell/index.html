<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Larch 預覽</title>
  <link rel="stylesheet" href="/shell/panel.css">
</head>
<body>
  <!-- 不給 fullscreen：播放器開場會自己切全螢幕，iframe 一全螢幕就蓋掉回饋按鈕。要全螢幕按 F11。 -->
  <iframe id="player" src="/play/market/local" allow="autoplay; fullscreen 'none'"></iframe>
  <div id="banner" hidden></div>
  <div id="controls">
    <button id="view-toggle" type="button" title="在播放與白板之間切換（B）">白板</button>
    <button id="sync-open" type="button" title="雲端同步（S）">雲端</button>
    <button id="fb-open" type="button" title="回饋（F）">回饋</button>
    <button id="lib-open" type="button" title="素材庫（唯讀，另開分頁）">素材庫</button>
    <select id="jump" title="跳到哪張卡（網址也可以帶 ?card=<卡片id>&line=<第幾句>）"></select>
  </div>

  <dialog id="fb">
    <form method="dialog" id="fb-form">
      <header>
        <strong>回饋</strong>
        <span id="fb-shot-status"></span>
        <button type="button" id="fb-regrant" hidden>重新授權截圖</button>
      </header>

      <label>位置
        <select id="fb-at"></select>
      </label>
      <div class="row">
        <button type="button" id="fb-here">從這張卡開始</button>
        <button type="button" id="fb-restart">從頭播</button>
      </div>

      <details open>
        <summary>台詞</summary>
        <textarea id="fb-text" rows="3"></textarea>
      </details>

      <details>
        <summary>語音</summary>
        <select id="fb-voice-kind">
          <option value="">（沒有問題）</option>
          <option value="misread">唸錯字</option>
          <option value="tone">語氣不對</option>
          <option value="redo">重配</option>
          <option value="other">其他</option>
        </select>
        <input id="fb-voice-chars" placeholder="哪個字（例：質地）">
        <input id="fb-voice-should" placeholder="應該怎麼唸（例：ㄓˊ ㄉㄧˋ）">
        <input id="fb-voice-note" placeholder="備註">
      </details>

      <details>
        <summary>演出</summary>
        <div id="fb-staging">
          <label><input type="checkbox" value="actor">立繪</label>
          <label><input type="checkbox" value="expression">表情</label>
          <label><input type="checkbox" value="background">背景</label>
          <label><input type="checkbox" value="bgm">BGM</label>
          <label><input type="checkbox" value="effect">特效</label>
          <label><input type="checkbox" value="transition">轉場</label>
          <label><input type="checkbox" value="other">其他</label>
        </div>
        <textarea id="fb-staging-note" rows="2" placeholder="哪裡不對"></textarea>
      </details>

      <label>其他備註
        <textarea id="fb-note" rows="2"></textarea>
      </label>

      <ul id="fb-history"></ul>
      <p id="fb-error" hidden></p>

      <footer>
        <button type="button" id="fb-cancel">取消</button>
        <button type="button" id="fb-submit">送出</button>
      </footer>
    </form>
  </dialog>

  <dialog id="sync-dialog">
    <form method="dialog" id="sync-form">
      <header>
        <strong>雲端同步 (Larch Sync)</strong>
        <span id="sync-status" style="margin-left:auto;font-size:12px;color:var(--muted)"></span>
      </header>

      <label>雲端專案 ID
        <input id="sync-pid" placeholder="project-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" required autocomplete="off">
      </label>

      <details id="sync-key-details">
        <summary id="sync-key-summary">API 金鑰 (已就緒)</summary>
        <div style="margin-top: 6px;">
          <input id="sync-key" type="password" placeholder="留空使用本機預設金鑰 (~/.config/larch/key)">
        </div>
      </details>

      <div id="sync-note" class="sync-box" style="border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--muted);background:rgba(0,0,0,0.2)">
        <b style="color:var(--text)">💡 安全防呆提示：</b><br>
        每次執行「拉取」或「推送」，本地專案皆會<b>自動建立帶時間戳的備份檔 (.bak)</b>，永不遺失歷史內容。
      </div>

      <p id="sync-error" style="color: var(--danger); margin: 0; font-size: 13px;" hidden></p>

      <footer style="display:flex;gap:8px;margin-top:8px;">
        <button type="button" id="sync-pull-btn">⬇ 從 Larch 拉取</button>
        <button type="button" id="sync-push-btn" style="border-color: var(--accent); color: var(--accent);">⬆ 推送至 Larch</button>
        <button type="button" id="sync-cancel-btn" style="margin-left: auto;">關閉</button>
      </footer>
    </form>
  </dialog>

  <script type="module" src="/shell/panel.js"></script>
</body>
</html>
